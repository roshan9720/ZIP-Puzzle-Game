<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZIP Path Puzzle Game - Unlimited Levels</title>
  <style>
    :root {
      --bg-color: #ffffff;
      --grid-bg: #ffedd5;           /* Light Orange Background */
      --grid-line: #fed7aa;         /* Grid Border Color */
      --path-color: #a85597;        /* Soft Purple Path Line */
      --circle-green: #22c55e;      /* Checkpoint Badges */
      --btn-cyan: #06b6d4;
      --btn-orange: #f97316;
      --coin-yellow: #f59e0b;
      --card-purple: #8b5cf6;
      --card-locked: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .mobile-frame {
      width: 100%;
      max-width: 420px;
      height: 100vh;
      max-height: 850px;
      background: var(--bg-color);
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      border-radius: 16px;
    }

    .screen {
      display: none;
      flex-direction: column;
      height: 100%;
      width: 100%;
    }

    .screen.active {
      display: flex;
    }

    /* COIN BADGE COMMON */
    .coin-badge {
      background: #000000;
      color: #ffffff;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .coin-badge::before {
      content: '★';
      color: var(--coin-yellow);
    }

    /* ---------------- UNIQUE HOME SCREEN ---------------- */
    .home-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 30px 20px;
      background: linear-gradient(180deg, #ffffff 0%, #fff7ed 100%);
      text-align: center;
    }

    .home-top {
      width: 100%;
      display: flex;
      justify-content: flex-end;
    }

    .logo-container {
      margin-top: 10px;
    }

    .home-logo {
      font-size: 4rem;
      font-weight: 900;
      color: var(--path-color);
      letter-spacing: 4px;
      line-height: 1;
      text-shadow: 0 4px 10px rgba(168, 85, 151, 0.2);
    }

    .home-tagline {
      font-size: 1rem;
      font-weight: 700;
      color: #64748b;
      letter-spacing: 2px;
      margin-top: 5px;
    }

    /* Decorative Grid Icon on Home */
    .home-illustration {
      width: 140px;
      height: 140px;
      background: var(--grid-bg);
      border: 3px solid var(--grid-line);
      border-radius: 20px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding: 10px;
      box-shadow: 0 10px 25px rgba(249, 115, 22, 0.15);
      margin: 20px 0;
    }

    .home-illustration .mini-cell {
      background: #fed7aa;
      border-radius: 8px;
    }

    .home-illustration .mini-cell.active-cell {
      background: var(--path-color);
    }

    .progress-card {
      background: #ffffff;
      border: 2px solid #ffedd5;
      padding: 15px 30px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      width: 100%;
      max-width: 280px;
    }

    .progress-card-title {
      font-size: 0.85rem;
      color: #64748b;
      font-weight: 700;
      text-transform: uppercase;
    }

    .progress-card-level {
      font-size: 1.8rem;
      font-weight: 900;
      color: #1e293b;
      margin-top: 2px;
    }

    .home-buttons-group {
      width: 100%;
      max-width: 280px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-play-now {
      background: var(--path-color);
      color: white;
      border: none;
      padding: 16px;
      border-radius: 30px;
      font-size: 1.2rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(168, 85, 151, 0.4);
      transition: transform 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-play-now:active {
      transform: scale(0.97);
    }

    .btn-home-menu {
      background: #334155;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(51, 65, 85, 0.3);
    }

    /* TOP BAR FOR GAME/MENU */
    .top-bar {
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      border-bottom: 1px solid #f1f5f9;
      z-index: 10;
    }

    .icon-btn {
      background: none;
      border: none;
      font-size: 1.8rem;
      font-weight: bold;
      color: #334155;
      cursor: pointer;
    }

    .zip-title-container {
      text-align: center;
    }

    .zip-logo-img {
      font-size: 2rem;
      font-weight: 900;
      color: var(--path-color);
      letter-spacing: 2px;
      line-height: 1;
    }

    .level-subtitle {
      font-size: 1rem;
      font-weight: 700;
      color: #1e293b;
      margin-top: 2px;
    }

    /* LEVEL MENU SCREEN */
    .menu-header {
      padding: 15px;
      text-align: center;
      background: var(--path-color);
      color: white;
      font-weight: bold;
      font-size: 1.2rem;
    }

    .jump-level-box {
      padding: 10px 15px;
      background: #f8fafc;
      display: flex;
      gap: 8px;
      border-bottom: 1px solid #e2e8f0;
    }

    .jump-level-box input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
    }

    .jump-level-box button {
      background: var(--path-color);
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .level-container {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }

    .level-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      padding-bottom: 15px;
    }

    .btn-level-select {
      background: var(--card-purple);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 12px 5px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 0 #6d28d9;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .btn-level-select.locked {
      background: var(--card-locked);
      box-shadow: 0 3px 0 #64748b;
      cursor: not-allowed;
      opacity: 0.6;
    }

    .pagination-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 15px;
      background: #ffffff;
      border-top: 1px solid #e2e8f0;
    }

    .pagination-bar button {
      background: #334155;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    /* GAME PLAY SCREEN */
    .game-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px 20px;
    }

    .grid-container {
      position: relative;
      background: var(--grid-bg);
      border: 3px solid var(--grid-line);
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      overflow: hidden;
    }

    .grid-board {
      display: grid;
      touch-action: none;
      position: relative;
      z-index: 2;
    }

    .svg-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .cell {
      box-sizing: border-box;
      border: 1px solid var(--grid-line);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: transparent;
    }

    .cell.visited {
      background-color: rgba(168, 85, 151, 0.15) !important;
    }

    .num-badge {
      width: 36px;
      height: 36px;
      background-color: var(--circle-green);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.05rem;
      z-index: 10;
      box-shadow: 0 3px 6px rgba(0,0,0,0.2);
      border: 2px solid #ffffff;
    }

    /* ACTION BUTTONS */
    .action-container {
      display: flex;
      gap: 15px;
      padding: 12px 20px 20px 20px;
    }

    .btn-clean {
      flex: 1;
      background: var(--btn-cyan);
      color: white;
      border: none;
      border-radius: 25px;
      padding: 12px 20px;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 10px rgba(6, 182, 212, 0.3);
    }

    .btn-share {
      flex: 1;
      background: var(--btn-orange);
      color: white;
      border: none;
      border-radius: 25px;
      padding: 12px 20px;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 10px rgba(249, 115, 22, 0.3);
    }

    .ad-banner {
      background: #ffffff;
      padding: 8px 15px;
      border-top: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* MODAL */
    .modal {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal.active { display: flex; }

    .modal-card {
      background: white;
      padding: 25px;
      border-radius: 20px;
      text-align: center;
      width: 80%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .btn-next {
      background: var(--path-color);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: bold;
      margin-top: 15px;
      cursor: pointer;
      width: 100%;
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <div class="mobile-frame">
    
    <!-- 1. UNIQUE HOME SCREEN (DEFAULT ACTIVE) -->
    <div id="home-screen" class="screen active">
      <div class="home-body">
        
        <div class="home-top">
          <div class="coin-badge coin-display">322</div>
        </div>

        <div class="logo-container">
          <div class="home-logo">ZIP</div>
          <div class="home-tagline">PATH PUZZLE GAME</div>
        </div>

        <!-- Decorative Mini Grid Artwork -->
        <div class="home-illustration">
          <div class="mini-cell active-cell"></div>
          <div class="mini-cell active-cell"></div>
          <div class="mini-cell"></div>
          <div class="mini-cell"></div>
          <div class="mini-cell active-cell"></div>
          <div class="mini-cell active-cell"></div>
          <div class="mini-cell"></div>
          <div class="mini-cell"></div>
          <div class="mini-cell active-cell"></div>
        </div>

        <div class="progress-card">
          <div class="progress-card-title">Current Level</div>
          <div class="progress-card-level" id="home-level-label">Level 1</div>
        </div>

        <div class="home-buttons-group">
          <button class="btn-play-now" id="home-play-btn">
            <span>PLAY NOW</span>
            <span>▶</span>
          </button>
          <button class="btn-home-menu" id="home-menu-btn">SELECT LEVEL ☰</button>
        </div>

      </div>
    </div>

    <!-- 2. LEVEL MENU SCREEN -->
    <div id="menu-screen" class="screen">
      <div class="top-bar">
        <button class="icon-btn" id="menu-back-btn">‹</button>
        <div style="font-weight: bold; font-size: 1.1rem; color:#1e293b;">Select Level</div>
        <div class="coin-badge coin-display">322</div>
      </div>
      
      <div class="jump-level-box">
        <input type="number" id="jump-input" placeholder="Enter Level (e.g. 105)" min="1">
        <button id="jump-btn">Go</button>
      </div>

      <div class="level-container">
        <div id="level-grid-menu" class="level-grid"></div>
      </div>

      <div class="pagination-bar">
        <button id="prev-page-btn">‹ Prev</button>
        <span id="page-info-label" style="font-weight:bold; font-size:0.85rem; color:#475569;">Page 1</span>
        <button id="next-page-btn">Next ›</button>
      </div>
    </div>

    <!-- 3. GAME PLAY SCREEN -->
    <div id="game-screen" class="screen">
      
      <div class="top-bar">
        <button class="icon-btn" id="open-menu-btn">‹</button>
        <div class="zip-title-container">
          <div class="zip-logo-img">ZIP</div>
          <div class="level-subtitle" id="level-display">Level 1</div>
        </div>
        <div class="coin-badge coin-display">322</div>
      </div>

      <div class="game-body">
        <div class="grid-container" id="grid-container">
          <svg class="svg-layer" id="svg-path-layer"></svg>
          <div id="grid" class="grid-board"></div>
        </div>
      </div>

      <div class="action-container">
        <button class="btn-clean" id="clean-btn">
          <span>Clean</span>
          <span style="font-size:0.85rem;">8 ★</span>
        </button>
        <button class="btn-share" onclick="alert('Sharing level link...')">
          <span>➔</span>
          <span>Share</span>
        </button>
      </div>

      <div class="ad-banner">
        <div style="display:flex; align-items:center; gap:10px;">
          <div style="background:var(--coin-yellow); width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:white; font-size:0.8rem;">★</div>
          <div>
            <div style="font-weight: bold; font-size: 0.8rem; color: #1e293b;">Remove ads</div>
            <div style="font-size: 0.7rem; color: #64748b;">Get rid of ads forever for $2.99</div>
          </div>
        </div>
      </div>

    </div>

    <!-- WIN MODAL -->
    <div id="win-modal" class="modal">
      <div class="modal-card">
        <h2 style="color:var(--path-color)">Level Cleared! 🎉</h2>
        <p style="margin-top:10px; font-weight: 600; color:#334155;" id="win-msg">+10 Coins Earned!</p>
        <button class="btn-next" id="next-lvl-btn">Next Level ➔</button>
      </div>
    </div>

  </div>

  <script>
    let coins = parseInt(localStorage.getItem('zip_coins')) || 322;
    let currentLevel = parseInt(localStorage.getItem('zip_current_level')) || 1;
    let highestUnlocked = parseInt(localStorage.getItem('zip_highest_unlocked')) || 1;
    let savedPaths = JSON.parse(localStorage.getItem('zip_saved_paths')) || {};
    let menuPage = 1;
    const levelsPerPage = 60;

    function updateCoins(amount) {
      coins += amount;
      if (coins < 0) coins = 0;
      localStorage.setItem('zip_coins', coins);
      document.querySelectorAll('.coin-display').forEach(el => el.innerText = coins);
    }

    function saveCurrentPath() {
      savedPaths[currentLevel] = path;
      localStorage.setItem('zip_saved_paths', JSON.stringify(savedPaths));
    }

    function mulberry32(a) {
      return function() {
        var t = a += 0x6D2B79F5;
        t = Math.imul(t ^ t >>> 15, t | 1);
        t ^= t + Math.imul(t ^ t >>> 7, t | 61);
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    function generateSolvableLevel(lvl) {
      const rand = mulberry32(lvl * 123456 + 789);
      
      let size = 4;
      if (lvl > 10) size = 5;
      if (lvl > 50) size = 6;
      if (lvl > 150) size = 7;

      const total = size * size;
      let fullPath = [];
      let visited = Array(size).fill(0).map(() => Array(size).fill(false));

      function dfs(r, c) {
        fullPath.push({ r, c });
        visited[r][c] = true;
        if (fullPath.length === total) return true;

        let dirs = [{ r: r - 1, c }, { r: r + 1, c }, { r, c: c - 1 }, { r, c: c + 1 }];
        dirs.sort(() => rand() - 0.5);

        for (let d of dirs) {
          if (d.r >= 0 && d.r < size && d.c >= 0 && d.c < size && !visited[d.r][d.c]) {
            if (dfs(d.r, d.c)) return true;
          }
        }
        fullPath.pop();
        visited[r][c] = false;
        return false;
      }

      dfs(Math.floor(rand() * size), Math.floor(rand() * size));

      if (fullPath.length < total) {
        fullPath = [];
        for (let r = 0; r < size; r++) {
          if (r % 2 === 0) {
            for (let c = 0; c < size; c++) fullPath.push({ r, c });
          } else {
            for (let c = size - 1; c >= 0; c--) fullPath.push({ r, c });
          }
        }
      }

      let numCheckpoints = size === 4 ? 3 : (size === 5 ? 4 : (size === 6 ? 5 : 6));
      if (lvl > 300) numCheckpoints = Math.min(8, numCheckpoints + 2);

      const checkpoints = {};
      const step = Math.floor((total - 1) / (numCheckpoints - 1));

      for (let i = 0; i < numCheckpoints; i++) {
        let idx = i === numCheckpoints - 1 ? total - 1 : i * step;
        const cell = fullPath[idx];
        checkpoints[`${cell.r},${cell.c}`] = i + 1;
      }

      return { size, checkpoints, autoSolution: fullPath };
    }

    let gridCols = 4;
    let path = [];
    let isDragging = false;
    let checkpoints = {};
    let totalCells = 16;
    let maxCheckpoint = 1;
    let cellSize = 75;

    function switchScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    function updateHomeUI() {
      document.getElementById('home-level-label').innerText = `Level ${currentLevel}`;
      updateCoins(0);
    }

    function startLevel(lvl) {
      if (lvl < 1) lvl = 1;
      currentLevel = lvl;
      localStorage.setItem('zip_current_level', currentLevel);

      const data = generateSolvableLevel(lvl);
      gridCols = data.size;
      checkpoints = data.checkpoints;
      totalCells = gridCols * gridCols;
      maxCheckpoint = Math.max(...Object.values(checkpoints), 1);

      document.getElementById('level-display').innerText = `Level ${lvl}`;

      if (savedPaths[currentLevel] && savedPaths[currentLevel].length > 0) {
        path = [...savedPaths[currentLevel]];
      } else if (currentLevel < highestUnlocked) {
        path = [...data.autoSolution];
        saveCurrentPath();
      } else {
        path = [];
      }

      isDragging = false;
      cellSize = Math.floor(310 / gridCols);

      const gridElem = document.getElementById('grid');
      gridElem.style.gridTemplateColumns = `repeat(${gridCols}, ${cellSize}px)`;
      gridElem.style.gridTemplateRows = `repeat(${gridCols}, ${cellSize}px)`;
      gridElem.innerHTML = '';

      for (let r = 0; r < gridCols; r++) {
        for (let c = 0; c < gridCols; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.dataset.r = r;
          cell.dataset.c = c;

          const key = `${r},${c}`;
          if (checkpoints[key]) {
            const numBadge = document.createElement('div');
            numBadge.className = 'num-badge';
            numBadge.innerText = checkpoints[key];
            cell.appendChild(numBadge);
          }

          gridElem.appendChild(cell);
        }
      }

      switchScreen('game-screen');
      updateCoins(0);
      updateUI(false);
    }

    function tryAddToPath(r, c) {
      const key = `${r},${c}`;
      const cellVal = checkpoints[key] || null;

      if (path.length === 0) {
        if (cellVal === 1) { 
          path.push({ r, c }); 
          saveCurrentPath();
          return true; 
        }
        return false;
      }

      if (path.length > 1) {
        const prev = path[path.length - 2];
        if (prev.r === r && prev.c === c) { 
          path.pop(); 
          saveCurrentPath();
          return true; 
        }
      }

      if (path.some(p => p.r === r && p.c === c)) return false;

      const head = path[path.length - 1];
      if (Math.abs(head.r - r) + Math.abs(head.c - c) !== 1) return false;

      if (cellVal !== null) {
        const hitCheckpoints = path.map(p => checkpoints[`${p.r},${p.c}`]).filter(Boolean);
        const currentHighest = hitCheckpoints.length > 0 ? Math.max(...hitCheckpoints) : 1;
        if (cellVal !== currentHighest + 1) return false;
      }

      path.push({ r, c });
      saveCurrentPath();
      return true;
    }

    function drawSVGPath() {
      const svg = document.getElementById('svg-path-layer');
      svg.innerHTML = '';

      if (path.length === 0) return;

      let pointsStr = '';
      path.forEach((p, idx) => {
        const x = p.c * cellSize + cellSize / 2;
        const y = p.r * cellSize + cellSize / 2;
        pointsStr += `${x},${y} `;

        if (idx === 0) {
          const startCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          startCircle.setAttribute('cx', x);
          startCircle.setAttribute('cy', y);
          startCircle.setAttribute('r', cellSize * 0.22);
          startCircle.setAttribute('fill', '#a85597');
          svg.appendChild(startCircle);
        }
        if (idx === path.length - 1 && path.length > 1) {
          const endCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          endCircle.setAttribute('cx', x);
          endCircle.setAttribute('cy', y);
          endCircle.setAttribute('r', cellSize * 0.18);
          endCircle.setAttribute('fill', '#f97316');
          svg.appendChild(endCircle);
        }
      });

      if (path.length > 1) {
        const polyline = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
        polyline.setAttribute('points', pointsStr.trim());
        polyline.setAttribute('fill', 'none');
        polyline.setAttribute('stroke', '#a85597');
        polyline.setAttribute('stroke-width', cellSize * 0.35);
        polyline.setAttribute('stroke-linecap', 'round');
        polyline.setAttribute('stroke-linejoin', 'round');
        svg.insertBefore(polyline, svg.firstChild);
      }
    }

    function updateUI(checkWin = true) {
      document.querySelectorAll('.cell').forEach(c => c.classList.remove('visited'));

      path.forEach((p) => {
        const elem = document.querySelector(`[data-r="${p.r}"][data-c="${p.c}"]`);
        if (elem) elem.classList.add('visited');
      });

      drawSVGPath();

      if (checkWin && path.length === totalCells) {
        const hitCheckpoints = path.map(p => checkpoints[`${p.r},${p.c}`]).filter(Boolean);
        if (hitCheckpoints.length === maxCheckpoint) {
          if (currentLevel >= highestUnlocked) {
            highestUnlocked = currentLevel + 1;
            localStorage.setItem('zip_highest_unlocked', highestUnlocked);
            updateCoins(10);
            document.getElementById('win-msg').innerText = `Level ${currentLevel} Cleared! +10 Coins!`;
          } else {
            document.getElementById('win-msg').innerText = `Level ${currentLevel} Solved!`;
          }
          document.getElementById('win-modal').classList.add('active');
        }
      }
    }

    function renderMenu() {
      const menuGrid = document.getElementById('level-grid-menu');
      menuGrid.innerHTML = '';

      const startLvl = (menuPage - 1) * levelsPerPage + 1;
      const endLvl = startLvl + levelsPerPage - 1;

      for (let i = startLvl; i <= endLvl; i++) {
        const btn = document.createElement('button');
        const isUnlocked = i <= highestUnlocked;
        btn.className = `btn-level-select ${!isUnlocked ? 'locked' : ''}`;
        btn.innerText = i;

        if (isUnlocked) {
          btn.addEventListener('click', () => startLevel(i));
        }

        menuGrid.appendChild(btn);
      }

      document.getElementById('page-info-label').innerText = `Levels ${startLvl} - ${endLvl}`;
    }

    // Controls & Drag Listeners
    const gridElem = document.getElementById('grid');
    gridElem.addEventListener('pointerdown', (e) => {
      const cell = e.target.closest('.cell');
      if (!cell) return;
      isDragging = true;
      tryAddToPath(parseInt(cell.dataset.r), parseInt(cell.dataset.c));
      updateUI(true);
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const target = document.elementFromPoint(e.clientX, e.clientY);
      if (!target) return;
      const cell = target.closest('.cell');
      if (cell && tryAddToPath(parseInt(cell.dataset.r), parseInt(cell.dataset.c))) {
        updateUI(true);
      }
    });

    window.addEventListener('pointerup', () => isDragging = false);

    // Clean Button Logic
    document.getElementById('clean-btn').addEventListener('click', () => {
      if (coins >= 8) {
        updateCoins(-8);
        path = [];
        saveCurrentPath();
        updateUI(false);
      } else {
        alert("Not enough coins to Clean! Need 8 ⭐");
      }
    });

    document.getElementById('next-lvl-btn').addEventListener('click', () => {
      document.getElementById('win-modal').classList.remove('active');
      startLevel(currentLevel + 1);
    });

    // Home Screen Navigation Listeners
    document.getElementById('home-play-btn').addEventListener('click', () => {
      startLevel(currentLevel);
    });

    document.getElementById('home-menu-btn').addEventListener('click', () => {
      menuPage = Math.ceil(highestUnlocked / levelsPerPage) || 1;
      renderMenu();
      switchScreen('menu-screen');
    });

    document.getElementById('open-menu-btn').addEventListener('click', () => {
      updateHomeUI();
      switchScreen('home-screen');
    });

    document.getElementById('menu-back-btn').addEventListener('click', () => {
      updateHomeUI();
      switchScreen('home-screen');
    });

    document.getElementById('prev-page-btn').addEventListener('click', () => {
      if (menuPage > 1) {
        menuPage--;
        renderMenu();
      }
    });

    document.getElementById('next-page-btn').addEventListener('click', () => {
      menuPage++;
      renderMenu();
    });

    document.getElementById('jump-btn').addEventListener('click', () => {
      const targetLvl = parseInt(document.getElementById('jump-input').value);
      if (targetLvl && targetLvl > 0) {
        if (targetLvl <= highestUnlocked) {
          startLevel(targetLvl);
        } else {
          alert(`Level ${targetLvl} is locked! Highest unlocked is ${highestUnlocked}.`);
        }
      }
    });

    // Initialize Home Screen on Load
    updateHomeUI();
  </script>
</body>
</html>
