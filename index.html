<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ZIP Path Puzzle Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="mobile-frame">
    
    <!-- NOTIFICATION TOAST BANNER -->
    <div id="toast-banner" class="toast-notification">
      <span>⚠️</span>
      <span id="toast-msg">Level Incomplete!</span>
    </div>

    <!-- HOME SCREEN -->
    <div id="home-screen" class="screen active">
      <div class="home-body">
        <div class="home-top">
          <div class="coin-badge coin-display">322</div>
        </div>
        <div>
          <div class="home-logo">ZIP</div>
          <div class="home-tagline">PATH PUZZLE GAME</div>
        </div>
        <div class="home-illustration">
          <div class="mini-cell active-cell"></div>
          <div class="mini-cell active-cell"></div>
          <div class="mini-cell"></div>
          <div class="mini-cell"></div>
          <div class="mini-cell active-cell"></div>
          <div class="mini-cell active-cell"></div>
          <div class="mini-cell"></div>
          <div class="mini-cell"></div>
          <div class="mini-cell active-cell"></div>
        </div>
        <div class="progress-card">
          <div class="progress-card-title">Current Level</div>
          <div class="progress-card-level" id="home-level-label">Level 1</div>
        </div>
        <div class="home-buttons-group">
          <button class="btn-play-now" id="home-play-btn" type="button">
            <span>PLAY NOW</span>
            <span>▶</span>
          </button>
          <button class="btn-home-menu" id="home-menu-btn" type="button">SELECT LEVEL ☰</button>
        </div>
      </div>
    </div>

    <!-- LEVEL MENU SCREEN -->
    <div id="menu-screen" class="screen">
      <div class="top-bar">
        <button class="icon-btn" id="menu-back-btn">‹</button>
        <div style="font-weight: bold; font-size: 1rem;">Select Level</div>
        <div class="coin-badge coin-display">500</div>
      </div>
      <div class="jump-level-box">
        <input type="number" id="jump-input" placeholder="Enter Level (e.g. 105)" min="1">
        <button id="jump-btn">Go</button>
      </div>
      <div class="level-container">
        <div id="level-grid-menu" class="level-grid"></div>
      </div>
      <div class="pagination-bar">
        <button id="prev-page-btn">‹ Prev</button>
        <span id="page-info-label" style="font-weight:bold; font-size:0.8rem;">Page 1</span>
        <button id="next-page-btn">Next ›</button>
      </div>
    </div>

          <!-- GAME PLAY SCREEN -->
      <div id="game-screen" class="screen">
        <div class="top-bar">
          <button class="icon-btn" id="open-menu-btn" type="button">‹</button>
          <div class="top-bar-center">
            <div class="zip-logo-img">ZIP</div>
            <div class="level-subtitle" id="level-display">Level 1</div>
          </div>
          <div class="coin-badge coin-display">500</div>
        </div>
      
        <div class="game-body">
          <div class="grid-container" id="grid-container">
            <svg class="svg-layer" id="svg-path-layer"></svg>
            <div id="grid" class="grid-board"></div>
          </div>
        </div>
      
        <div class="action-container">
          <button class="btn-clean" id="clean-btn" type="button">
            <span>Clean</span>
            <span style="font-size:0.8rem;">8 ★</span>
          </button>
          <button class="btn-share" id="share-btn" type="button">
            <span>➔</span>
            <span>Share</span>
          </button>
        </div>
      
        <div class="ad-banner">
          <div style="display:flex; align-items:center; gap:8px;">
            <div style="background:var(--coin-yellow); width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:white; font-size:0.75rem;">★</div>
            <div>
              <div style="font-weight: bold; font-size: 0.75rem;">Remove ads</div>
              <div style="font-size: 0.65rem; color: #64748b;">Get rid of ads forever for $2.99</div>
            </div>
          </div>
        </div>
      </div>

    <!-- WIN MODAL -->
    <div id="win-modal" class="modal">
      <div class="modal-card">
        <h2 style="color:var(--path-color)">Level Cleared! 🎉</h2>
        <p style="margin-top:8px; font-weight: 600; font-size:0.9rem;" id="win-msg">+10 Coins Earned!</p>
        <button class="btn-next" id="next-lvl-btn">Next Level ➔</button>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
